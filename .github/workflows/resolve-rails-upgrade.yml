name: Resolve Rails upgrade dependencies

on:
  push:
    branches:
      - maintenance/rails-8-1-security-upgrade
    paths:
      - Gemfile

permissions:
  contents: write

jobs:
  update_lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Resolve Rails 8.1 dependencies
        run: bundle update rails
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          if ! git diff --cached --quiet; then
            git commit -m "Resolve Rails 8.1 dependencies in Gemfile.lock"
            git push origin HEAD:maintenance/rails-8-1-security-upgrade
          fi
